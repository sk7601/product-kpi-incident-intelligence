[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "product-kpi-incident-intelligence"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pandas>=2.2,<3", "numpy>=2,<2.4", "plotly>=6,<7", "streamlit>=1.45,<2", "scikit-learn>=1.6,<2", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.coverage.run]
source = ["product.analytics", "product.validation", "product.detection", "product.investigation", "product.reporting"]
